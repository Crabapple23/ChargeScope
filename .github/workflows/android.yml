name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble debug APKs (standard + miuix)
        run: ./gradlew assembleStandardDebug assembleMiuixDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chargescope-standard-debug
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chargescope-miuix-debug
          path: android/app/build/outputs/apk/miuix/debug/app-miuix-debug.apk
      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest testMiuixDebugUnitTest --no-daemon --stacktrace
