[workspace]
resolver = "2"
members = [
    "crates/cs-model",
    "crates/cs-core",
    "crates/cs-collector",
    "crates/cs-protocol",
    "crates/cs-device",
    "crates/cs-analyzer",
    "crates/cs-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cs-model = { path = "crates/cs-model" }
cs-core = { path = "crates/cs-core" }
cs-collector = { path = "crates/cs-collector" }
cs-protocol = { path = "crates/cs-protocol" }
cs-device = { path = "crates/cs-device" }
cs-analyzer = { path = "crates/cs-analyzer" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uniffi = "0.28"
cs-ffi = { path = "crates/cs-ffi" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
